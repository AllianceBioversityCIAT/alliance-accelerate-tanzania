sonar.projectKey=AllianceBioversityCIAT_alliance-accelerate-tanzania
sonar.organization=alliancebioversityciat

# ---------------------------------------------------------------------------
# Copy-paste detection exclusions
#
# Duplication is a code smell because duplicated LOGIC drifts: two copies of a
# rule, one gets fixed. Neither exclusion below is logic, and in one case the
# duplication is the mechanism that makes a test work at all.
# ---------------------------------------------------------------------------

# 1. The consent-policy verbatim pin (~320 of the 403 lines flagged on PR #73).
#
# `consent-policy.spec.ts` holds an INDEPENDENT literal copy of the approved
# consent text and compares it against `consent-policy.ts`. The copy is the
# point: `Registration.consentPolicyVersion` is legal evidence, and this test
# is what stops a clause being silently altered or dropped from the text a
# person accepted.
#
# The two ways to remove the duplication both break it:
#   - import the text from the module -> the test compares the module to
#     itself and can never fail. This exact defect was FAILed twice by review
#     in this same module.
#   - hash the content -> a failure says "hash mismatch" instead of naming the
#     clause that moved, and updating it means pasting a new hash, which is the
#     mechanical reflex that turns a gate into decoration.
#
# A literal pin costs 160 duplicated lines and, when it fails, shows exactly
# which sentence of a legal document changed. That trade is deliberate.
sonar.cpd.exclusions=backend/src/registrations/consent-policy.ts,\
  backend/src/registrations/consent-policy.spec.ts,\
  frontend/lib/content/legal/**

# 2. `frontend/lib/content/legal/**` (~83 lines).
#
# These modules are CIAT's approved legal prose expressed as typed data. What
# Sonar matches across Terms of Use and the Privacy Policy is the repeated
# STRUCTURE of the literal — `blocks: [`, `kind: 'paragraph'`, `entries: [` —
# once per section, not shared wording. Verified: exactly two long fragments
# are common to both files and both are structural, zero are prose.
#
# Deduplicating a legal document against another legal document is also the one
# thing this spec must not do: each is carried verbatim, and a future edition
# from Legal is diffed against the delivered file.
