# aws-accounts.conf — ACCELERATE Tanzania Seed Registry (infra, T-3)
# ---------------------------------------------------------------------------
# The mapping from an AWS_PROFILE name to the AWS account id every WRITING
# infra/scripts/*.sh script must resolve to (requirements.md FR-3;
# design.md §7.3). Read by _guard.sh's assert_account, one directory below
# this file.
#
# Committed deliberately — the product owner's recorded decision,
# 2026-09-18: a guard that silently does not run on a fresh clone is a
# guard that does not exist (root CLAUDE.md: "A gate that cannot run
# cannot fail"). `infra/samconfig.toml` carries no account id, and no
# account id is versioned in any configuration or executable file.
#
# FORMAT: one row per profile, exactly `<AWS_PROFILE>=<12-digit account id>`.
# This file is PARSED with `awk -F=` — it is NEVER `source`d.
# `IBD-DEV=569113802249` is not a valid bash assignment (the hyphen is
# illegal in a bash identifier); `source`-ing this file under
# `set -euo pipefail` would abort every script on a *correct* profile —
# the sign-reversed failure design.md §7.3 / judgment.md S-6 names.
#
# A future environment (e.g. a Prod account, OQ-INFRA-1) is a one-line
# addition here, never a code change — no account id literal appears in
# any infra/scripts/*.sh file.
#
# Verified against the live credential, 2026-09-18:
#   $ aws sts get-caller-identity --profile IBD-DEV
#   { "Account": "569113802249", "Arn": "arn:aws:iam::569113802249:user/cognito_csicap" }
IBD-DEV=569113802249
