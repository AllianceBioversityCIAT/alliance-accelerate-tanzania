AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  ACCELERATE Tanzania (dev) - backend stack: NestJS on Lambda + HTTP API (T-3).
  Stack: accelerate-tz-dev-backend. Composes DATABASE_URL from the data-auth
  cross-stack exports + a Secrets Manager dynamic reference (the password is
  injected at deploy time, never a literal - NFR-2). Deploy with:
  sam deploy --profile IBD-DEV --region eu-west-1.

Parameters:
  AllowedOrigin:
    Type: String
    Description: >-
      CORS allow-origin for the HTTP API. Default `*` for the dev bootstrap
      (step 3); locked to the CloudFront URL on the set-cors redeploy (step 5,
      FR-6, DD-6).
    Default: "*"
  DataAuthStackName:
    Type: String
    Description: >-
      Name of the data-auth stack that exports the DB wiring values
      (DbSecretArn, RdsEndpoint, RdsPort, DbName, DbMasterUsername). Imported
      here via Fn::ImportValue to compose DATABASE_URL.
    Default: accelerate-tz-dev-data-auth
  MailTransport:
    Type: String
    Description: >-
      Which MailService transport the Lambda uses. Phase A's `ses` rollback
      control (enhancement/email-notification-microservice design.md §7.3)
      is gone: Phase B (T-10) deleted the SES adapter from the codebase,
      leaving the code able to run `'microservice' | 'no-op'`
      (mail-transport.interface.ts). This parameter's AllowedValues narrows
      what a DEPLOYED STACK may select to the one of those two the product
      intends live here — `no-op` remains for tests, not for this template.
      ⚠️ T-9 — the deployed verification this removal was supposed to be
      gated on — HAS NOT RUN. Phase B proceeded on an explicit product-owner
      override recorded in that spec's execution.md; the gate's own checkbox
      is deliberately still unticked. Do not read this parameter's single
      value as evidence the replacement was verified here. Passed
      through explicitly by deploy.sh and set-cors.sh (both use
      --parameter-overrides) so an unrelated operator run can never silently
      revert it via SAM's UsePreviousValue.
    AllowedValues:
      - microservice
    Default: microservice

Resources:
  # ════════════════════════════════════════════════════════════════════════════
  # T3-A1 - OTP HMAC key (design.md §4.3, NFR-2). Generated by CloudFormation;
  # the value never appears in this template, in CloudFormation console/CLI
  # output, or in git - it is referenced by the Lambda ONLY via the dynamic
  # reference below, resolved at deploy time (same pattern as DB_PASSWORD).
  # ════════════════════════════════════════════════════════════════════════════
  OtpHmacSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-otp-hmac-secret"
      Description: >-
        HMAC key for hashing registration OTP codes at rest. Losing this
        value does not expose stored codes, but it must never be logged,
        printed, or committed (design.md §4.3).
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ════════════════════════════════════════════════════════════════════════════
  # T-8 - OneCGIAR notification-microservice credentials (FR-7; design.md
  # §7.2). The `GenerateSecretString` property below is the ONLY place that
  # defines which keys this secret holds - point at that property rather
  # than re-enumerating the set, so a future key added there needs no
  # matching edit here. ONE restatement exists, by necessity:
  # `CONSUMED_SECRET_KEYS` in infra/README.md §7, because a jq expression
  # cannot reference a CloudFormation property. It self-checks against the
  # live secret (`keys - $consumed`) and MUST be updated alongside any key
  # added here - AND SO MUST the jq merge beside it. Updating only
  # CONSUMED_SECRET_KEYS silences the detector while the merge still omits
  # the new variable, which is the silent-stale-value outcome the detector
  # exists to prevent. Every key this property defines is consumed ONLY via
  # {{resolve:secretsmanager:...:SecretString:<key>}} dynamic references below
  # - never a template/script/committed literal (FR-7's BUT).
  #
  # `GenerateSecretString` (as used by OtpHmacSecret above) can generate AT
  # MOST ONE key, and a dynamic reference to a JSON key that does not exist
  # fails the ENTIRE stack operation - so a single-key secret cannot back
  # multiple references. `SecretStringTemplate` below supplies every key
  # except the one `GenerateStringKey` fills with a random placeholder -
  # together they guarantee every key `GenerateSecretString` defines exists
  # in the secret from the first deploy onward, so no dynamic reference
  # below is ever resolved against a missing key.
  #
  # ⚠️ OPERATOR RUNBOOK - order depends on whether this is a fresh account.
  #
  # FRESH ACCOUNT: there is no "flip" deploy to be before. The MailTransport
  # parameter above defaults to "microservice" (T-10), so a fresh account's
  # very FIRST deploy already creates this stack - and MailMicroserviceSecret
  # along with it - at "microservice". The secret cannot hold real values
  # BEFORE that first deploy, because the deploy is what creates it. The
  # only possible order is: first deploy (secret lands with its
  # placeholders) -> put-secret-value with the real values (below) -> then
  # FORCE the update, because that put-secret-value call by itself produces
  # an EMPTY changeset once the stack already sits at "microservice" (see
  # the "This has a corollary" paragraph below) - infra/README.md §7, "After
  # writing the secret, confirm it actually took effect", IS that forcing
  # step; it is not another deploy.
  #
  # PRE-EXISTING STACK (one that predates Phase B / the T-9 flip): the same
  # placeholders MUST be overwritten with real values before, or as part
  # of, the redeploy that moves MailTransport to "microservice" - the next
  # paragraph covers why that redeploy's own parameter change forces the
  # resolution regardless.
  #
  # `put-secret-value --secret-string` REPLACES THE WHOLE DOCUMENT -
  # it is not a merge. Writing a partial document SILENTLY DELETES whichever
  # key(s) it omits, and the next resolve of a deleted key fails the whole
  # stack operation. EVERY key `GenerateSecretString` defines MUST be
  # written in ONE JSON document, in ONE call,
  # via `--secret-string file://<600-mode-temp-file>` (never an inline
  # literal - it would land in shell history, the exact hazard FR-7 exists
  # to prevent). The complete, copy-pasteable command - `--profile
  # IBD-DEV --region eu-west-1 --secret-id
  # accelerate-tz-dev-backend-mail-microservice-secret` and the safe
  # temp-file pattern - is in infra/README.md, section "Mail microservice
  # secret - operator runbook (T-8)". Do not improvise the command from
  # this comment; none of those flags fit usefully here.
  #
  # PRE-EXISTING-STACK PATH ONLY (a fresh-account CREATE never reaches this
  # paragraph - a newly created resource resolves every property once,
  # trivially, with no changeset question to ask): writing the secret's
  # values alone changes nothing in THIS TEMPLATE, so it forces no changeset
  # by itself: CloudFormation diffs the unresolved template + parameters to
  # decide WHETHER a resource needs updating, and only re-resolves dynamic
  # references while it processes an update to that resource - not because
  # Environment.Variables happens to be one property. At T-9 the
  # MailTransport flip is a real parameter change, so
  # it forces ApiFunction to update regardless (over-determined, in fact -
  # the flip, these placeholder edits, and a new code artifact each force
  # it independently), and that update re-resolves EVERY dynamic reference
  # inside Environment.Variables, including every one this secret backs,
  # against whatever the secret holds at that moment.
  #
  # This has a corollary the T-9 flip does NOT cover: once the stack
  # already sits at MailTransport=microservice, a LATER secret correction
  # or rotation with nothing else changing produces an EMPTY changeset -
  # both deploy scripts pass --no-fail-on-empty-changeset, so the deploy
  # reports success while the old secret value stays live. See
  # infra/README.md §7 ("Mail microservice secret - operator runbook
  # (T-8)"), "After writing the secret, confirm it actually took effect",
  # for how to force that case.
  # ════════════════════════════════════════════════════════════════════════════
  MailMicroserviceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-mail-microservice-secret"
      Description: >-
        OneCGIAR notification-microservice configuration. The keys this
        secret holds are defined by this resource's own GenerateSecretString
        property below - that is the single authority. The one deliberate
        restatement is CONSUMED_SECRET_KEYS in infra/README.md §7, which
        self-checks; see the comment above this resource. Placeholder
        values at creation: the operator MUST
        overwrite EVERY key it defines, in one put-secret-value call, before
        the MailTransport=microservice deploy (design.md §7.2, §7.3). Never
        log, print, or commit any value.
        queueName is here at the product owner's direction (2026-09-16): it is
        not a credential and grants no access on its own, but it discloses the
        platform's queue naming and which environment we target, which does not
        belong in a repository. EMAIL_SENDER deliberately stayed a template
        literal - it is the From header of every message the system sends, so
        hiding it would protect nothing while adding an operator step.
      GenerateSecretString:
        SecretStringTemplate: '{"apiKey": "REPLACE_BEFORE_MICROSERVICE_DEPLOY", "queueName": "REPLACE_BEFORE_MICROSERVICE_DEPLOY"}'
        GenerateStringKey: "rabbitmqUrl"
        PasswordLength: 64
        ExcludePunctuation: true

  # ════════════════════════════════════════════════════════════════════════════
  # T-3 - NestJS Lambda (FR-3, FR-7, NFR-2; DD-2, DD-4)
  # ════════════════════════════════════════════════════════════════════════════
  # One Lambda wrapping the whole NestJS app (dist/lambda.handler, serverless-http).
  # Outside the VPC (DD-2: free internet egress, no NAT/VPC endpoints) - it reaches
  # the public RDS endpoint over TLS. DATABASE_URL is COMPOSED here with !Sub (DD-4):
  # host/user/db/port come from the data-auth exports via Fn::ImportValue, and the
  # password is a Secrets Manager dynamic reference resolved at deploy time - so no
  # secret value ever lands in this template or the repo (NFR-2).
  ApiFunction:
    Type: AWS::Serverless::Function
    # Build with the project Makefile (backend/Makefile) instead of the default
    # `npm pack` builder: the compiled `dist/` is gitignored, so npm-pack would
    # ship source without `dist/lambda.handler`. The Makefile target runs
    # `npm ci && npm run build` and stages dist/ + prisma + the rhel Prisma engine
    # into the artifact, so the deployed handler and query engine are present.
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: ../../backend
      Handler: dist/lambda.handler
      Runtime: nodejs24.x
      MemorySize: 512
      Timeout: 15
      # Cap concurrency to keep dev RDS connections + cost bounded (NFR-6).
      ReservedConcurrentExecutions: 5
      # NO VpcConfig - Lambda runs outside the VPC (DD-2).
      Environment:
        Variables:
          # Discrete DB connection parts — PrismaService composes the URL and
          # URL-ENCODES the password (CloudFormation !Sub cannot encode it, and a
          # raw password with URL-special chars corrupts the connection string).
          # Password ONLY via the {{resolve:secretsmanager:...}} dynamic reference
          # (NFR-2), resolved at deploy — never committed.
          DB_HOST: !ImportValue
            Fn::Sub: "${DataAuthStackName}-RdsEndpoint"
          DB_PORT: !ImportValue
            Fn::Sub: "${DataAuthStackName}-RdsPort"
          DB_NAME: !ImportValue
            Fn::Sub: "${DataAuthStackName}-DbName"
          DB_USER: !ImportValue
            Fn::Sub: "${DataAuthStackName}-DbMasterUsername"
          DB_PASSWORD: !Sub
            - "{{resolve:secretsmanager:${SecretArn}:SecretString:password}}"
            - SecretArn: !ImportValue
                Fn::Sub: "${DataAuthStackName}-DbSecretArn"
          # TLS posture (dev): encrypted, cert chain NOT verified — Prisma's MySQL
          # (Rust) engine can't reliably trust a custom CA on this stack. Acceptable
          # for dev (dev-only endpoint, and no real applicant PII today — product
          # owner, 2026-09-17: DEV holds test data only, no public registration or
          # contact submission from a real person received yet; the self-registration
          # write path is live and unauthenticated on this same environment, so
          # this can change without anyone acting or noticing);
          # verified TLS deferred to infra/network-hardening.
          DB_SSL: accept_invalid_certs
          # Cognito pool/client ids feed the JWT verifier (auth-wiring FR-5/FR-9):
          # the JwtAuthGuard verifies access tokens against this pool's JWKS and
          # checks the client id as audience. Imported from the data-auth exports.
          COGNITO_USER_POOL_ID: !ImportValue
            Fn::Sub: "${DataAuthStackName}-UserPoolId"
          COGNITO_CLIENT_ID: !ImportValue
            Fn::Sub: "${DataAuthStackName}-UserPoolClientId"
          # T3-A1 - mail transport + OTP HMAC key (design.md §4.3). AWS_REGION
          # is deliberately NOT set here - it is reserved by the Lambda runtime.
          # MAIL_TRANSPORT is the MailTransport PARAMETER (T-8); Phase B (T-10)
          # deleted the SES adapter, leaving the code able to run
          # 'microservice' | 'no-op'. AllowedValues/Default narrow what THIS
          # DEPLOYED STACK may select to "microservice" (design.md §7.3) -
          # `no-op` remains for tests, not for this template.
          MAIL_TRANSPORT: !Ref MailTransport
          OTP_HMAC_SECRET: !Sub "{{resolve:secretsmanager:${OtpHmacSecret}:SecretString}}"
          # T-8 - OneCGIAR notification-microservice config (design.md §4.5,
          # §7.1, §7.2). Each variable below whose value is a
          # {{resolve:secretsmanager:...}} reference is sourced from
          # MailMicroserviceSecret and never appears as a literal here - read
          # the lines themselves for which those are; this comment deliberately
          # does not restate the list or its size, because a restated count is
          # what went stale when queueName was added on 2026-09-16. Why each
          # key is in the secret rather than a literal is recorded once, on
          # the MailMicroserviceSecret resource above, and in design.md §4.5.
          # EMAIL_SENDER stays a literal DELIBERATELY: it is the From header of
          # every message the system sends, so it is public by construction -
          # hiding it would protect nothing while adding an operator step. If
          # spoofing is the worry, SPF/DKIM on the domain is the control, not
          # the absence of the address from this file.
          # EMAIL_SENDER_NAME is the one variable that defaults rather than
          # throwing (getMicroserviceMailConfig); its value here is the fixed
          # project value from design.md §4.5, not a placeholder.
          RABBITMQ_URL: !Sub "{{resolve:secretsmanager:${MailMicroserviceSecret}:SecretString:rabbitmqUrl}}"
          MICROSERVICE_API_KEY: !Sub "{{resolve:secretsmanager:${MailMicroserviceSecret}:SecretString:apiKey}}"
          EMAIL_QUEUE_NAME: !Sub "{{resolve:secretsmanager:${MailMicroserviceSecret}:SecretString:queueName}}"
          EMAIL_SENDER: AccelerateTZ-No-reply@cgiar.org
          EMAIL_SENDER_NAME: "ACCELERATE Tanzania Seed Registry -"
          # contact/contact-channels (T-11, FR-3, design.md §7.1): fallback
          # recipient for the public contact form when the Cognito `admin`
          # group resolves empty or the directory call fails
          # (AdminRecipientResolver.getFallback()). Reached rarely by design -
          # every normal submission goes to the live `admin` group - so a
          # message landing here is one nobody is expecting.
          #
          # CHOSEN BY THE PRODUCT OWNER, 2026-09-18. The previous value
          # (j.cadavid@cgiar.org) was never specified by anyone: it was
          # INFERRED under the SES sandbox, where only an SES-verified
          # identity could receive mail and that was the one identity this
          # template verified (contact/contact-channels execution.md records
          # the inference and asked the owner to override it). FR-6 removed
          # SES and with it the constraint, leaving an address chosen by a
          # dead technical reason. This value replaces it by decision.
          CONTACT_FALLBACK_RECIPIENT: Justus.Ochieng@cgiar.org
      Policies:
        # SAM adds the default CloudWatch Logs policy automatically. This scoped
        # statement adds GetSecretValue limited to the ONE data-auth secret.
        # (DATABASE_URL is injected at deploy via the dynamic reference, so a
        # runtime GetSecretValue is currently unused - included, scoped, for
        # optional rotation/runtime-read. Never a `*` resource.)
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !ImportValue
                Fn::Sub: "${DataAuthStackName}-DbSecretArn"
            # Admin user-management module (T-6, FR-12): least-privilege Cognito
            # admin actions, scoped to the SINGLE user-pool ARN (no `*` resource).
            # Pool ARN is constructed inline from the imported UserPoolId.
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminResetUserPassword
                # contact/contact-channels (T-11, FR-3): the contact form's
                # AdminRecipientResolver lists the `admin` group's current
                # members to resolve live recipients. Missing grants fail at
                # runtime, not deploy — the resolver's directory call would
                # error and silently degrade to CONTACT_FALLBACK_RECIPIENT.
                - cognito-idp:ListUsersInGroup
              Resource: !Sub
                - "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${PoolId}"
                - PoolId: !ImportValue
                    Fn::Sub: "${DataAuthStackName}-UserPoolId"
      Events:
        # Explicit methods (NOT `ANY`) so that OPTIONS matches NO route and API
        # Gateway's CorsConfiguration auto-answers CORS preflight with 204. With a
        # catch-all `ANY` route, OPTIONS is proxied to NestJS (no OPTIONS handler →
        # 404), which browsers reject as a failed preflight — breaking the admin
        # module's Bearer/JSON write requests (T-11 discovery). NestJS still owns
        # the api/v1 prefix; every real method proxies to the single handler.
        # NB: block style — a flow-style `{ Path: /{proxy+} }` is INVALID YAML
        # (the `{` in `/{proxy+}` opens a nested flow-map). Keep these expanded.
        ProxyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: GET
        ProxyPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: POST
        ProxyPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: PATCH
        ProxyDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: DELETE
        RootGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET

  # ════════════════════════════════════════════════════════════════════════════
  # HTTP API (API Gateway v2) - auto $default stage serves at the root domain,
  # so ApiBaseUrl has no path prefix; clients append /api/v1/... (FR-3, FR-7).
  # ════════════════════════════════════════════════════════════════════════════
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Public reads use GET + OPTIONS (CORS preflight); POST/PATCH/DELETE are
      # now allowed for the Admin user-management module write endpoints (T-6).
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - OPTIONS
          - POST
          - PATCH
          - DELETE
        AllowHeaders:
          - Content-Type
          - Authorization

Outputs:
  ApiBaseUrl:
    Description: >-
      HTTP API root URL ($default stage; no path prefix). Clients append
      /api/v1/... Consumed by the frontend build (NEXT_PUBLIC_API_BASE_URL, T-8).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-ApiBaseUrl"
