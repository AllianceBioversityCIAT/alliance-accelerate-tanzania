AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ACCELERATE Tanzania (dev) - frontend hosting stack: the Next.js static export
  served from a PRIVATE S3 bucket exclusively via CloudFront, fronted by Origin
  Access Control (OAC) (T-5). A viewer-request CloudFront Function rewrites the
  per-route export's directory paths to their index.html so `/map` resolves
  (DD-5). No SAM Transform - these are plain CloudFormation resources. The app is
  served from the custom domain in CustomDomainName, with the default
  *.cloudfront.net domain still answering alongside it (FR-5, NFR-3).
  Stack: accelerate-tz-dev-frontend. Deploy with:
  sam deploy --profile IBD-DEV --region eu-west-1.

Parameters:
  # This stack owns the distribution, so it is the only place that can know the
  # app's real public address - `Distribution.DomainName` only ever returns the
  # *.cloudfront.net name, never an alias. Everything downstream derives the URL
  # from the PublicAppUrl output below, so the domain is written HERE and nowhere
  # else.
  CustomDomainName:
    Type: String
    Description: >-
      Public DNS name the app is served from, aliased onto this distribution.
      Empty falls back to the default *.cloudfront.net domain.
    Default: accelerate-tz.alliance.cgiar.org
  AcmCertificateId:
    Type: String
    Description: >-
      Id of the ACM certificate covering CustomDomainName - the uuid only; the
      full ARN is composed below with this account's id, because an account id
      may not be versioned under infra/ (the account-id gate in
      scripts/tests enforces that). The certificate MUST live in us-east-1:
      CloudFront reads certificates from that region only, whatever region the
      stack itself is deployed in. This one is the *.alliance.cgiar.org
      wildcard, which covers accelerate-tz.alliance.cgiar.org.
    Default: e4741547-0e83-4c0a-b430-550d3782cdf2

Conditions:
  # Both halves are required: an alias without a matching certificate is a
  # distribution CloudFront refuses to deploy.
  HasCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomainName, ""]]
    - !Not [!Equals [!Ref AcmCertificateId, ""]]

Resources:
  # ════════════════════════════════════════════════════════════════════════════
  # T-5 - Private S3 origin bucket (FR-5, NFR-3; DD-5)
  # ════════════════════════════════════════════════════════════════════════════
  # Holds the Next static export (`out/`): out/index.html, out/map/index.html,
  # and _next/ hashed assets (synced by T-8). The bucket is fully PRIVATE - all
  # four Block Public Access switches on, ACLs disabled (BucketOwnerEnforced),
  # and no S3 website hosting. The only read path is CloudFront via OAC + the
  # scoped bucket policy below; a direct S3 object URL returns 403 (DD-5).
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        # ACLs disabled - the bucket owner owns every object; no ACL grants.
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: accelerate-tz
        - Key: environment
          Value: dev

  # ════════════════════════════════════════════════════════════════════════════
  # Origin Access Control (OAC) - current AWS best practice over legacy OAI.
  # CloudFront signs origin requests with SigV4 so the private bucket trusts only
  # this distribution (DD-5). The bucket policy below pins it via AWS:SourceArn.
  # ════════════════════════════════════════════════════════════════════════════
  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: OAC for the private frontend S3 origin.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ════════════════════════════════════════════════════════════════════════════
  # CloudFront Function (viewer-request) - clean/directory URL → index.html (DD-5)
  # ════════════════════════════════════════════════════════════════════════════
  # Next static export emits a directory per route (out/map/index.html), so the
  # default S3 origin would 404 on `/map` (no `index.html` appended for sub-paths;
  # DefaultRootObject only covers `/`). This rewrites the viewer URI before the
  # origin request:
  #   "/"               → "/index.html"        (ends with "/")
  #   "/map"            → "/map/index.html"    (no "." in last segment → extensionless)
  #   "/map/"           → "/map/index.html"    (ends with "/")
  #   "/_next/x.abcd.js"→ "/_next/x.abcd.js"   (last segment has "." → untouched asset)
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Map directory/clean URLs to the static export's index.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            // Directory request - serve its index document.
            request.uri = uri + 'index.html';
          } else {
            // Clean route (no file extension in the last path segment) - treat
            // as a directory and serve its index.html. Hashed assets like
            // /_next/x.abcd.js keep a "." in the last segment and pass through.
            var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
            if (lastSegment.indexOf('.') === -1) {
              request.uri = uri + '/index.html';
            }
          }
          return request;
        }

  # ════════════════════════════════════════════════════════════════════════════
  # Response headers policy - security headers on every document (ATP-33)
  # ════════════════════════════════════════════════════════════════════════════
  # Written out rather than referencing AWS's managed SecurityHeadersPolicy by
  # id: the managed id cannot be read with the developer credential, and HSTS
  # needs an explicit `Preload: false` here (see below), which an opaque managed
  # id would neither express nor guarantee.
  #
  # Deliberately ABSENT, both recorded so a later reader does not read them as
  # oversights:
  #   - Content-Security-Policy. The map loads Leaflet tiles from an external
  #     host and the page loads GA4; a CSP that misses either breaks them, and
  #     sometimes only in some browsers. It goes out in Report-Only first, as
  #     its own change.
  #   - Permissions-Policy. The location picker's "Use my current location"
  #     (ATP-80) needs geolocation, and with no header the browser's default
  #     allowlist is already `self`. Denying it here would break that button
  #     with no visible error. If one is ever added, `geolocation=(self)` is
  #     the correct value.
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Security response headers for the ACCELERATE Tanzania frontend.
        SecurityHeadersConfig:
          # CloudFront already redirects HTTP -> HTTPS, which leaves the FIRST
          # request of a session in the clear. This closes that window.
          # Preload is false ON PURPOSE: the site is on a shared
          # *.cloudfront.net domain, and preloading is submitted per-domain and
          # effectively irreversible. Revisit when a custom domain is adopted.
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          # nosniff. The platform serves CSV exports, so a sniffed download is
          # the concrete case here, not a theoretical one.
          ContentTypeOptions:
            Override: true
          # Clickjacking cover for the admin panel, which deletes and imports.
          FrameOptions:
            FrameOption: DENY
            Override: true
          # The design forbids sensitive data in URLs; this keeps the URL from
          # leaking outward on navigation.
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  # ════════════════════════════════════════════════════════════════════════════
  # CloudFront Distribution - the public HTTPS entry point (FR-5, NFR-4; DD-5)
  # ════════════════════════════════════════════════════════════════════════════
  # Single private-S3 origin via OAC; redirect-to-HTTPS; the rewrite function on
  # viewer-request; AWS managed CachingOptimized policy; PriceClass_100 to keep
  # dev cost minimal (NFR-6/§9). Aliases + ACM when CustomDomainName is set, the
  # default CloudFront certificate and domain otherwise (NFR-3).
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: ACCELERATE Tanzania (dev) frontend.
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        # Declared here, not attached by hand. An alias that exists only in the
        # console is removed by the next deploy of this stack, without an error.
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Sub "arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/${AcmCertificateId}"
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig:
              # Empty OriginAccessIdentity is required when using OAC (not OAI).
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # AWS managed "CachingOptimized" cache policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN

  # ════════════════════════════════════════════════════════════════════════════
  # Bucket policy - grant ONLY CloudFront (this distribution) s3:GetObject (DD-5)
  # ════════════════════════════════════════════════════════════════════════════
  # The cloudfront.amazonaws.com service principal, scoped by AWS:SourceArn to
  # this exact distribution. No `Principal: "*"`, no public statement - the bucket
  # stays private and is readable only through the OAC-signed CloudFront origin.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOacRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}"

Outputs:
  PublicAppUrl:
    Description: >-
      The app's canonical public URL - the custom domain when one is set, the
      default CloudFront domain otherwise. This is what the backend CORS
      AllowedOrigin and the mail templates' PUBLIC_APP_BASE_URL derive from
      (FR-6, DD-6); CloudFrontUrl below cannot serve that role because it never
      reports an alias.
    Value: !If
      - HasCustomDomain
      - !Sub "https://${CustomDomainName}"
      - !Sub "https://${Distribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-PublicAppUrl"
  CloudFrontUrl:
    Description: >-
      The distribution's own *.cloudfront.net URL. Still the address
      deploy-frontend.sh resolves the distribution Id from, and still a working
      way to reach the app - but no longer its canonical URL: use PublicAppUrl.
    Value: !Sub "https://${Distribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontUrl"
  FrontendBucketName:
    Description: >-
      Private origin bucket name. Consumed by the frontend build/deploy
      (`aws s3 sync out/ s3://<bucket>`, T-8).
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucketName"
